[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unifai-toolkit-numbers"
version = "0.1.0"
description = "Exact decimal arithmetic for the numbers that decide a trade. A UnifAI toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["unifai", "defi", "trading", "agents", "toolkit", "decimal"]
dependencies = ["unifai-guard"]

[project.optional-dependencies]
serve = ["unifai-sdk"]

[tool.setuptools.packages.find]
include = ["numbers_toolkit*"]
